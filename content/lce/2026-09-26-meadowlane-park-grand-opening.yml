title: Meadowlane Park Grand Opening
date: 2026-09-26
time: "16:00"
description: Over the past year, a stunning pond has been added to Kitchener's Meadowlane Park. Join dignitaries and community members to celebrate the park's official opening with music provided by the KW Symphony String Quartet. Speeches begin at 4:30PM and the music will follow a tree planting ceremony at approximately 5:00PM. The event will take place on the south side of the park, near the Royal Orchard Drive entrance (near 94 Royal Orchard Dr.).
location: Meadownlane Park - 138 Glen Park Crescent, Kitchener
