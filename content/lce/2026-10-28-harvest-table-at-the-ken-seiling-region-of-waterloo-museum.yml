title: Harvest Table at the Ken Seiling Region of Waterloo Museum
date: 2026-10-28
time: "18:00"
description: |-
  The KWS String Quartet is delighted to provide music for this celebration of tradition, culture, and fresh, local flavours. The evening will raise funds in support of the museum's impactful annual Education Festival, Celebrating Indigenous Diversity and Excellence, where we offer free Indigenous programming to equity deserving students in the Region of Waterloo.
  ​Chef Aicha, from Six Nations of the Grand River, is the Founder of Esha's Eats, and knowledgeable Cultural Strategist, who will speak with guests about pre-contact foodways and cooking.
location: 10 Huron Rd., Kitchener
